name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: pc-agent-x86_64-linux
          path: |
            dist/pc-agent-x86_64-linux.tar.gz
            dist/pc-agent-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: pc-agent-aarch64-macos
          path: |
            dist/pc-agent-aarch64-macos.tar.gz
            dist/pc-agent-aarch64-macos.tar.gz.sha256
          if-no-files-found: error
      - run: bash scripts/build-pkg.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: pc-agent-macos-pkg
          path: |
            dist/pc-agent-*-macos.pkg
            dist/pc-agent-*-macos.pkg.sha256
          if-no-files-found: error

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/pc-agent-x86_64-linux.tar.gz \
            dist/pc-agent-x86_64-linux.tar.gz.sha256 \
            dist/pc-agent-aarch64-macos.tar.gz \
            dist/pc-agent-aarch64-macos.tar.gz.sha256 \
            dist/pc-agent-*-macos.pkg \
            dist/pc-agent-*-macos.pkg.sha256 \
            --generate-notes
