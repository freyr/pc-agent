name: Release

# main is the bleeding edge: each push to main replaces the pre-release "edge".
# A semver tag vX.Y.Z on a commit of main makes a normal release. The release App
# of tag.yml pushes the tag (no GitHub release); its annotated message holds the
# title and the release notes.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  # The one Rust version of release.yml and of CI. Change both together. The
  # release builds use no cache, so a poisoned cache cannot reach a release.
  RUST_TOOLCHAIN: "1.99.1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release only from main: $GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi
      - name: Check that the tag matches the Cargo version
        if: github.ref_type == 'tag'
        run: |
          version="$(awk '/^\[/ { in_pkg = ($0 == "[package]") } in_pkg && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' Cargo.toml)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the Cargo version $version."
            exit 1
          fi

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-x86_64-linux
          path: |
            dist/pc-agent-x86_64-linux
            dist/pc-agent-x86_64-linux.tar.gz
            dist/pc-agent-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-aarch64-macos
          path: |
            dist/pc-agent-aarch64-macos
            dist/pc-agent-aarch64-macos.tar.gz
            dist/pc-agent-aarch64-macos.tar.gz.sha256
          if-no-files-found: error
      - run: bash scripts/build-pkg.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-macos-pkg
          path: |
            dist/pc-agent-*-macos.pkg
            dist/pc-agent-*-macos.pkg.sha256
          if-no-files-found: error

  # W8 adds pc-agent-x86_64-windows.zip; the bare exe stays for the self-update.
  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release
      - name: Copy the exe and write its checksum
        run: |
          $name = "pc-agent-x86_64-windows.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\pc-agent.exe "dist\$name"
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$name").Hash.ToLower()
          # The format of sha256sum, so `sha256sum -c` checks it.
          [IO.File]::WriteAllText("$PWD\dist\$name.sha256", "$hash  $name`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-x86_64-windows
          path: |
            dist/pc-agent-x86_64-windows.exe
            dist/pc-agent-x86_64-windows.exe.sha256
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # scripts/manifest.sh reads the version, the commit and the commit time
      # (the build time that build.rs embeds) from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The manifest goes to signed/, not dist/. Each release is made as a
      # draft with all assets and published after that, so a client never
      # sees a manifest whose assets are missing.
      - name: Write and sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "::error::The repo secret MINISIGN_SECRET_KEY is not set."
            exit 1
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          mkdir signed
          bash scripts/manifest.sh dist > signed/manifest.json
          cat signed/manifest.json
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m signed/manifest.json -x signed/manifest.json.minisig
          # The agents check the manifest with the key in src/update/key.rs:
          # a secret that does not match it stops the release here, before
          # edge is deleted.
          pub="$(sed -n 's/^pub const PUBLIC_KEY: &str = "\(.*\)";$/\1/p' src/update/key.rs)"
          if [[ -z "$pub" ]]; then
            echo "::error::No PUBLIC_KEY in src/update/key.rs."
            exit 1
          fi
          minisign -V -P "$pub" -m signed/manifest.json -x signed/manifest.json.minisig
      - name: Create the semver release
        if: github.ref_type == 'tag'
        run: |
          # The notes: the message of the annotated tag that tag.yml pushed,
          # without its first line (the title) and the blank line after it.
          # A lightweight tag (no message) falls back to the generated notes.
          notes_args=(--generate-notes)
          ref_json="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")"
          if [[ "$(jq -r .object.type <<<"$ref_json")" == "tag" ]]; then
            gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<<"$ref_json")" --jq .message \
              | tail -n +3 > "$RUNNER_TEMP/notes.md"
            if [[ -s "$RUNNER_TEMP/notes.md" ]]; then
              notes_args=(--notes-file "$RUNNER_TEMP/notes.md")
            fi
          fi
          # A draft until all assets and the manifest are there: a failed
          # upload leaves no public release without a manifest.
          gh release create "$GITHUB_REF_NAME" dist/* signed/manifest.json signed/manifest.json.minisig \
            --draft "${notes_args[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Replace the edge pre-release
        if: github.ref_type == 'branch'
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/* signed/manifest.json signed/manifest.json.minisig \
            --draft \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "edge (main ${GITHUB_SHA::7})" \
            --notes "Bleeding-edge build of main at $GITHUB_SHA. Not a stable release: use the latest vX.Y.Z release for normal installs."
          gh release edit edge --draft=false
