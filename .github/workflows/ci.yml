name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: pc-agent-x86_64-linux
          path: |
            dist/pc-agent-x86_64-linux.tar.gz
            dist/pc-agent-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: pc-agent-aarch64-macos
          path: |
            dist/pc-agent-aarch64-macos.tar.gz
            dist/pc-agent-aarch64-macos.tar.gz.sha256
          if-no-files-found: error
      - run: bash scripts/build-pkg.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: pc-agent-macos-pkg
          path: |
            dist/pc-agent-*-macos.pkg
            dist/pc-agent-*-macos.pkg.sha256
          if-no-files-found: error
