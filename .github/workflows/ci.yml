name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The one Rust version of CI and of release.yml. Change both together.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy with the update test features
        run: cargo clippy --all-targets --features update-test-key,update-test-exit -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - name: Sign a test manifest and verify it
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          bash scripts/check-manifest.sh dist
      # The real edge release, signed with the project key; the check must
      # print its commit, whether this build is newer, older or the same.
      - name: Check the edge release with update --check
        run: bash scripts/check-edge.sh target/release/pc-agent
      # The test seams of the update (a test key, a test URL, a test
      # version) must never reach a release or the release-mode CI build.
      - name: Check that no release build enables an update test feature
        run: |
          if grep -n 'update-test' .github/workflows/release.yml; then
            echo "::error::release.yml enables an update test feature" >&2
            exit 1
          fi
          # Anchored to a run line, so this check does not match itself.
          if grep -nE '^\s*(- )?run: cargo build --release.*--features' .github/workflows/*.yml; then
            echo "::error::a release build of a workflow enables a feature" >&2
            exit 1
          fi
      - name: Update the service end to end (systemd)
        run: |
          sudo apt-get install -y -q mosquitto mosquitto-clients
          bash scripts/e2e-update.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-x86_64-linux
          path: |
            dist/pc-agent-x86_64-linux.tar.gz
            dist/pc-agent-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: bash scripts/package.sh dist
      - name: Sign a test manifest and verify it
        run: |
          brew install minisign
          bash scripts/check-manifest.sh dist
      # The real edge release, signed with the project key; the check must
      # print its commit, whether this build is newer, older or the same.
      - name: Check the edge release with update --check
        run: bash scripts/check-edge.sh target/release/pc-agent
      - name: Update the service end to end (launchd)
        run: |
          brew install mosquitto
          bash scripts/e2e-update.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-aarch64-macos
          path: |
            dist/pc-agent-aarch64-macos.tar.gz
            dist/pc-agent-aarch64-macos.tar.gz.sha256
          if-no-files-found: error
      - run: bash scripts/build-pkg.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-macos-pkg
          path: |
            dist/pc-agent-*-macos.pkg
            dist/pc-agent-*-macos.pkg.sha256
          if-no-files-found: error

  # The runner has no NVIDIA GPU; it has a console session (runneradmin). The
  # job installs the service, runs it against a local broker and removes it,
  # then runs diagnose. The GPU is on in the test configuration, so the NVML
  # failure path runs.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy with the update test features
        run: cargo clippy --all-targets --features update-test-key,update-test-exit -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # A unit test of a bin crate has no path to the built exe, so this
      # test is ignored in `cargo test` and gets the exe here.
      - name: Run the session helper against a test pipe
        env:
          PC_AGENT_EXE: target\release\pc-agent.exe
        run: cargo test -- --ignored --nocapture the_helper_sends_last_input_over_a_test_pipe
      # The runner has no minisign package (signing happens only on Linux in
      # release.yml), so this job verifies the committed fixture that a
      # throwaway key signed; the Linux and macOS jobs sign in the job.
      - name: Verify the signed test manifest with the exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = '.\target\release\pc-agent.exe'
          $data = 'src\update\testdata'
          & $exe update --verify "$data\manifest.json" "$data\manifest.json.minisig" "$data\test.pub"
          if ($LASTEXITCODE -ne 0) { throw "the signed manifest did not verify" }
          $changed = Join-Path $env:RUNNER_TEMP 'changed.json'
          $text = [IO.File]::ReadAllText("$PWD\$data\manifest.json")
          $text = $text.Replace('"version": "', '"version": "9')
          [IO.File]::WriteAllText($changed, $text)
          & $exe update --verify $changed "$data\manifest.json.minisig" "$data\test.pub"
          if ($LASTEXITCODE -eq 0) { throw "a changed manifest verified" }
          $global:LASTEXITCODE = 0
      # The real edge release, signed with the project key; the check must
      # print its commit, whether this build is newer, older or the same.
      # The release workflow of the same push can replace edge meanwhile, so
      # it tries again (as scripts/check-edge.sh does).
      - name: Check the edge release with update --check
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $url = 'https://github.com/freyr/pc-mqtt-agent/releases/download/edge/manifest.json'
          $ok = $false
          foreach ($i in 1..5) {
            "== attempt $i"
            $out = @(.\target\release\pc-agent.exe update --check --channel edge 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $out
            if ($code -eq 0) {
              $expected = (curl.exe -fsSL $url | ConvertFrom-Json).commit
              if ($expected -and ($out -match "^manifest: .* commit $expected ")) {
                "OK: the check prints the edge commit $expected"
                $ok = $true
                break
              }
              "the output does not have the edge commit '$expected'"
            }
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { throw "update --check --channel edge failed" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-agent-x86_64-windows
          path: target/release/pc-agent.exe
          if-no-files-found: error

      - name: Restore the Mosquitto installer from the cache
        id: mosquitto-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/mosquitto-2.0.22-install-windows-x64.exe
          key: mosquitto-2.0.22-install-windows-x64

      - name: Download the Mosquitto installer
        if: steps.mosquitto-cache.outputs.cache-hit != 'true'
        run: |
          # Chocolatey has no mosquitto package: use the official installer.
          # mosquitto.org sometimes drops the connection ("unexpected EOF"),
          # and Invoke-WebRequest does not retry that, so use curl.
          curl.exe --fail --location --retry 8 --retry-all-errors --retry-delay 5 `
            --output "$HOME\mosquitto-2.0.22-install-windows-x64.exe" `
            "https://mosquitto.org/files/binary/win64/mosquitto-2.0.22-install-windows-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "the Mosquitto download failed" }

      - name: Start a Mosquitto broker on 127.0.0.1:1883
        run: |
          # The official installer (NSIS, silent).
          $setup = "$HOME\mosquitto-2.0.22-install-windows-x64.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the mosquitto installer failed with $($p.ExitCode)" }
          # The runner ends background processes at the end of a step, so the
          # broker runs as the mosquitto service, which reads mosquitto.conf
          # from its install folder.
          Stop-Service mosquitto -ErrorAction SilentlyContinue
          $dir = "C:\Program Files\mosquitto"
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $log = (Join-Path $env:RUNNER_TEMP "mosquitto.log") -replace '\\', '/'
          "listener 1883 127.0.0.1`nallow_anonymous true`nlog_dest file $log`nlog_type all`n" |
            Set-Content -Path "$dir\mosquitto.conf" -Encoding ascii
          if (-not (Get-Service mosquitto -ErrorAction SilentlyContinue)) {
            & "$dir\mosquitto.exe" install
            if ($LASTEXITCODE -ne 0) { throw "mosquitto install failed" }
          }
          Start-Service mosquitto
          Start-Sleep -Seconds 3
          if (-not (Test-NetConnection 127.0.0.1 -Port 1883 -InformationLevel Quiet)) {
            throw "no broker on 127.0.0.1:1883"
          }
          # mosquitto_sub on Windows ignores -W (no SIGALRM), so this helper
          # ends the read itself and returns nothing after the timeout.
          $read = Join-Path $env:RUNNER_TEMP "mqtt-read.ps1"
          @'
          param([string]$Topic, [int]$Seconds = 20)
          $out = Join-Path $env:RUNNER_TEMP ("mqtt-" + [guid]::NewGuid() + ".txt")
          $p = Start-Process -FilePath mosquitto_sub -NoNewWindow -PassThru `
            -ArgumentList "-h", "127.0.0.1", "-t", $Topic, "-C", "1" -RedirectStandardOutput $out
          if (-not $p.WaitForExit($Seconds * 1000)) { $p.Kill(); $p.WaitForExit() }
          if (Test-Path $out) { $v = Get-Content $out -Raw; if ($v) { $v.TrimEnd("`r", "`n") } }
          '@ | Set-Content -Path $read -Encoding utf8
          "MQTT_READ=$read" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install the service with a test configuration
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "ci-config.toml"
          @"
          [mqtt]
          host = "127.0.0.1"
          port = 1883
          username = "u"
          password = "p"

          [device]
          name = "CI-TEST"
          identifier = "pc-agent-CI-TEST"
          entity_prefix = "ci_test"

          [gpu]
          enabled = true
          "@ | Set-Content -Path $cfg -Encoding utf8
          # The runner has Fast Startup off, so turn it on for the install to
          # prove that the registry read and the warning work, then restore.
          $values = @(
            @{ Key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power'; Name = 'HiberbootEnabled' },
            @{ Key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power'; Name = 'HibernateEnabled' }
          )
          foreach ($v in $values) {
            $v.Old = (Get-ItemProperty $v.Key -Name $v.Name -ErrorAction SilentlyContinue).($v.Name)
            "$($v.Name) before: '$($v.Old)'"
            Set-ItemProperty -Path $v.Key -Name $v.Name -Value 1 -Type DWord
          }
          try {
            $out = .\target\release\pc-agent.exe install --config $cfg
            if ($LASTEXITCODE -ne 0) { throw "pc-agent install failed" }
            $out
          } finally {
            foreach ($v in $values) {
              if ($null -eq $v.Old) { Remove-ItemProperty -Path $v.Key -Name $v.Name -ErrorAction SilentlyContinue }
              else { Set-ItemProperty -Path $v.Key -Name $v.Name -Value $v.Old -Type DWord }
            }
          }
          if (-not ($out | Select-String -SimpleMatch 'Fast Startup is on')) { throw "no Fast Startup warning with Fast Startup on" }
          sc.exe qc pc-agent
          sc.exe qfailure pc-agent

      - name: Check that only SYSTEM and Administrators can open C:\ProgramData\pc-agent
        run: |
          $out = icacls C:\ProgramData\pc-agent
          $out
          $aces = @($out | Where-Object { $_ -match ':\(' })
          if ($aces.Count -ne 2) { throw "expected 2 entries, got $($aces.Count)" }
          foreach ($ace in $aces) {
            if ($ace -notmatch 'NT AUTHORITY\\SYSTEM:|BUILTIN\\Administrators:') { throw "unexpected entry: $ace" }
          }

      - name: Start the service and read the retained states
        run: |
          sc.exe start pc-agent
          Start-Sleep -Seconds 5
          $query = sc.exe query pc-agent
          $query
          if (-not ($query -match 'RUNNING')) { throw "pc-agent is not RUNNING" }
          $online = & $env:MQTT_READ 'homeassistant/sensor/CI-TEST/availability' 20
          "availability: $online"
          if ($online -ne 'online') { throw "expected online, got '$online'" }
          $boot = & $env:MQTT_READ 'homeassistant/sensor/CI-TEST/lastboot/state' 20
          "lastboot: $boot"
          if ($boot -notmatch '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}Z$') { throw "bad lastboot '$boot'" }
          $config = & $env:MQTT_READ 'homeassistant/sensor/CI-TEST/lastboot/config' 20
          "lastboot config: $config"
          if (($config | ConvertFrom-Json).name -ne 'lastboot') { throw "bad lastboot config" }
          $event = & $env:MQTT_READ 'homeassistant/sensor/CI-TEST/lastsystemstatechange/state' 20
          "lastsystemstatechange: $event"
          if ($event -ne 'ApplicationStarted') { throw "expected ApplicationStarted, got '$event'" }

      - name: Read the session states and check that no GPU is published
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $base = 'homeassistant/sensor/CI-TEST'
          # No console user on the runner: Unknown. Accept a console session too.
          $session = & $env:MQTT_READ "$base/sessionstate/state" 20
          "sessionstate: $session"
          if ($session -notin @('Unknown', 'Unlocked', 'Locked')) { throw "bad sessionstate '$session'" }
          if ($session -ne 'Unknown') { "note: the runner has a console session ($session)" }
          $users = & $env:MQTT_READ "$base/loggedusers/state" 20
          "loggedusers: $users"
          if ($users -notmatch '^\[.*\]$') { throw "bad loggedusers '$users'" }
          $display = & $env:MQTT_READ 'homeassistant/binary_sensor/CI-TEST/display/state' 5
          "display (none before the first notification): '$display'"
          $gpuconfig = & $env:MQTT_READ "$base/gpuload/config" 20
          if (($gpuconfig | ConvertFrom-Json).name -ne 'gpuload') { throw "no gpuload config: the GPU is not supplied" }
          # No NVIDIA GPU: no gpuload state, so the read must time out.
          $gpu = & $env:MQTT_READ "$base/gpuload/state" 10
          if ($gpu) { throw "unexpected gpuload state '$gpu'" }
          # The NVML init fails once and is retried after 5 min: one warning.
          # Exactly one: zero would mean that the failure path did not run.
          foreach ($i in 1..15) {
            $warnings = @(Select-String -Path C:\ProgramData\pc-agent\pc-agent.log -SimpleMatch 'NVML init failed')
            if ($warnings.Count -ge 1) { break }
            Start-Sleep -Seconds 1
          }
          $warnings | ForEach-Object { $_.Line }
          if ($warnings.Count -ne 1) { throw "expected exactly one NVML init warning, got $($warnings.Count)" }
          $global:LASTEXITCODE = 0

      - name: Check that the service starts the session helper
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $bin = 'homeassistant/binary_sensor/CI-TEST'
          $config = & $env:MQTT_READ "$bin/inputhelper/config" 20
          "inputhelper config: $config"
          $json = $config | ConvertFrom-Json
          if ($json.name -ne 'inputhelper' -or $json.device_class -ne 'running') { throw "bad inputhelper config" }
          # The service runs as SYSTEM and starts the helper in the console
          # session of runneradmin. The connect publishes OFF before the
          # helper connects, so read the retained state until it is ON.
          $state = ''
          foreach ($i in 1..15) {
            $state = & $env:MQTT_READ "$bin/inputhelper/state" 5
            if ($state -eq 'ON') { break }
            Start-Sleep -Seconds 2
          }
          "inputhelper: $state"
          Select-String -Path C:\ProgramData\pc-agent\pc-agent.log -Pattern 'session helper|pipe' | ForEach-Object { $_.Line }
          if ($state -ne 'ON') { throw "inputhelper is '$state', expected ON" }
          $active = & $env:MQTT_READ 'homeassistant/sensor/CI-TEST/lastactive/state' 20
          "lastactive: $active"
          if ($active -notmatch '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}Z$') { throw "bad lastactive '$active'" }
          Get-CimInstance Win32_Process -Filter "Name = 'pc-agent.exe'" |
            ForEach-Object { "process $($_.ProcessId) session $($_.SessionId): $($_.CommandLine)" }
          $global:LASTEXITCODE = 0

      - name: Restart the service and check that the old helper exits
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $bin = 'homeassistant/binary_sensor/CI-TEST'
          function Get-Helpers {
            @(Get-CimInstance Win32_Process -Filter "Name = 'pc-agent.exe'" |
              Where-Object { $_.CommandLine -match 'session-helper' })
          }
          $old = Get-Helpers
          $old | ForEach-Object { "old helper $($_.ProcessId) session $($_.SessionId)" }
          if ($old.Count -eq 0) { throw "no helper runs before the restart" }
          sc.exe stop pc-agent | Out-Null
          $stopped = $false
          foreach ($i in 1..20) {
            if ((sc.exe query pc-agent) -match 'STOPPED') { $stopped = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $stopped) { throw "pc-agent did not stop" }
          # The helper checks its pipe each 1 s: it must exit without input.
          $left = $old
          foreach ($i in 1..10) {
            $left = @($old | Where-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue })
            if ($left.Count -eq 0) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($left.Count -ne 0) { throw "the old helper still runs 5 s after the stop: $($left.ProcessId)" }
          # Remove the retained ON, so only the new service can set it again.
          mosquitto_pub -h 127.0.0.1 -r -n -t "$bin/inputhelper/state"
          if ($LASTEXITCODE -ne 0) { throw "cannot clear the retained inputhelper state" }
          sc.exe start pc-agent | Out-Null
          $state = ''
          foreach ($i in 1..15) {
            $state = & $env:MQTT_READ "$bin/inputhelper/state" 5
            if ($state -eq 'ON') { break }
            Start-Sleep -Seconds 2
          }
          "inputhelper after the restart: $state"
          if ($state -ne 'ON') { throw "inputhelper is '$state' after the restart, expected ON" }
          Get-Helpers | ForEach-Object { "new helper $($_.ProcessId) session $($_.SessionId)" }
          $global:LASTEXITCODE = 0

      - name: Uninstall the service
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          .\target\release\pc-agent.exe uninstall
          if ($LASTEXITCODE -ne 0) { throw "pc-agent uninstall failed" }
          $offline = & $env:MQTT_READ 'homeassistant/sensor/CI-TEST/availability' 20
          "availability: $offline"
          if ($offline -ne 'offline') { throw "expected offline after the stop, got '$offline'" }
          # The last will also gives offline; the log line proves the clean stop.
          if (-not (Select-String -Path C:\ProgramData\pc-agent\pc-agent.log -SimpleMatch 'offline acknowledged' -Quiet)) { throw "no clean stop: 'offline acknowledged' is not in the log" }
          # 1060: the service does not exist.
          $gone = $false
          foreach ($i in 1..10) {
            sc.exe query pc-agent | Out-Null
            if ($LASTEXITCODE -eq 1060) { $gone = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) { throw "the service pc-agent still exists" }
          if (-not (Test-Path C:\ProgramData\pc-agent\config.toml)) { throw "uninstall removed the configuration" }
          # The helper exits within 1 s after its pipe closes.
          $left = @()
          foreach ($i in 1..10) {
            $left = @(Get-CimInstance Win32_Process -Filter "Name = 'pc-agent.exe'" |
              Where-Object { $_.CommandLine -match 'session-helper' })
            if ($left.Count -eq 0) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($left.Count -ne 0) { throw "a session helper still runs after the uninstall: $($left.ProcessId)" }
          $global:LASTEXITCODE = 0

      # After the uninstall, so diagnose cannot disturb the service checks;
      # the retained availability is now offline and must stay offline.
      - name: Run diagnose as runneradmin
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $cfg = Join-Path $env:RUNNER_TEMP "ci-config.toml"
          $out = .\target\release\pc-agent.exe diagnose --config $cfg 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { throw "pc-agent diagnose ended with exit code $code" }
          if (-not ($out | Select-String -SimpleMatch '== End of diagnose')) { throw "no end marker" }
          # runneradmin is not LocalSystem: no SE_TCB_NAME for WTSQueryUserToken.
          if (-not ($out | Select-String -SimpleMatch 'helper: WTSQueryUserToken failed: 1314 (not running as SYSTEM)')) { throw "the helper line does not report the WTSQueryUserToken failure" }
          if (-not ($out | Select-String -SimpleMatch 'MQTT: connected to 127.0.0.1:1883')) { throw "the MQTT check did not connect" }
          $global:LASTEXITCODE = 0

      - name: Run diagnose as SYSTEM and check that it publishes nothing
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = (Resolve-Path .\target\release\pc-agent.exe).Path
          $dir = 'C:\ProgramData\pc-agent'
          $out = "$dir\diagnose.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          # GitHub runs the steps as runneradmin, so a scheduled task runs
          # diagnose as SYSTEM, with the configuration that install copied.
          @"
          @echo off
          $exe diagnose --config $dir\config.toml > $out 2>&1
          set rc=%ERRORLEVEL%
          rem Only SYSTEM can read the log of the mosquitto service: copy it
          rem to a folder that Administrators can read, before the end marker.
          copy /y "$($env:RUNNER_TEMP)\mosquitto.log" "$dir\mosquitto-copy.log" > nul
          echo exit code %rc% >> $out
          "@ | Set-Content -Path "$dir\diagnose.cmd" -Encoding ascii
          schtasks /Create /TN pcagent-diag /RU SYSTEM /SC ONCE /ST 00:00 /F /TR "$dir\diagnose.cmd"
          if ($LASTEXITCODE -ne 0) { throw "schtasks /Create failed" }
          schtasks /Run /TN pcagent-diag
          if ($LASTEXITCODE -ne 0) { throw "schtasks /Run failed" }
          $text = ''
          foreach ($i in 1..60) {
            # The file can be open in cmd while diagnose writes it.
            if (Test-Path $out) { $text = Get-Content $out -Raw -ErrorAction SilentlyContinue }
            if ($text -match 'exit code \d+') { break }
            Start-Sleep -Seconds 1
          }
          schtasks /Delete /TN pcagent-diag /F | Out-Null
          $text
          if ($text -notmatch 'exit code 0') { throw "diagnose as SYSTEM did not end with exit code 0 within 60 s" }
          if (-not $text.Contains('== End of diagnose')) { throw "no end marker" }
          # The runner has a console session (runneradmin).
          if (-not $text.Contains('helper: started in session')) { throw "the helper did not start in the console session" }
          if (-not $text.Contains('MQTT: connected to 127.0.0.1:1883')) { throw "the MQTT check did not connect" }
          # No last will and no publish: the availability is still what the
          # service left, and the broker got no PUBLISH from diagnose.
          $availability = & $env:MQTT_READ 'homeassistant/sensor/CI-TEST/availability' 20
          "availability: $availability"
          if ($availability -ne 'offline') { throw "diagnose changed the availability to '$availability'" }
          # The copy that the SYSTEM task made of the broker log.
          $log = Get-Content "$dir\mosquitto-copy.log" -Raw
          $lines = @($log -split "`r?`n" | Where-Object { $_.Contains('pc-agent-diagnose-CI-TEST') })
          $lines
          if ($lines.Count -eq 0) { throw "the broker log has no connect of pc-agent-diagnose-CI-TEST" }
          if ($lines | Where-Object { $_ -match 'PUBLISH from pc-agent-diagnose' }) { throw "diagnose published a message" }
          $global:LASTEXITCODE = 0

      # The update end to end: a throwaway minisign key (the runner has no
      # minisign package, so the job takes the exe of the minisign release),
      # and four builds of the test feature: 0.0.1, 0.0.2, 0.0.3 that exits
      # after the pending-file check, and 0.0.4.
      - name: Build the update test agents
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $e2e = Join-Path $env:RUNNER_TEMP 'e2e'
          New-Item -ItemType Directory -Force -Path $e2e | Out-Null
          $zip = Join-Path $e2e 'minisign.zip'
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 5 --output $zip `
            'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip'
          if ($LASTEXITCODE -ne 0) { throw "the minisign download failed" }
          Expand-Archive -Path $zip -DestinationPath "$e2e\minisign" -Force
          # The zip has a build for each CPU: take the x86_64 one.
          $minisign = (Get-ChildItem "$e2e\minisign" -Recurse -Filter minisign.exe |
            Where-Object { $_.FullName -match '\\x86_64\\' } | Select-Object -First 1).FullName
          if (-not $minisign) { throw "no minisign.exe in the zip" }
          & $minisign -G -W -p "$e2e\test.pub" -s "$e2e\test.key"
          if ($LASTEXITCODE -ne 0) { throw "minisign -G failed" }
          $env:PC_AGENT_TEST_PUBLIC_KEY = (Get-Content "$e2e\test.pub")[-1].Trim()
          # No debug info, as in scripts/e2e-update.sh.
          $env:CARGO_PROFILE_DEV_DEBUG = "0"
          $builds = @(
            @{ Version = '0.0.1'; Features = 'update-test-key' },
            @{ Version = '0.0.2'; Features = 'update-test-key' },
            @{ Version = '0.0.3'; Features = 'update-test-key,update-test-exit' },
            @{ Version = '0.0.4'; Features = 'update-test-key' }
          )
          foreach ($b in $builds) {
            $env:PC_AGENT_TEST_VERSION = $b.Version
            cargo build --features $b.Features --target-dir target\e2e
            if ($LASTEXITCODE -ne 0) { throw "the build of $($b.Version) failed" }
            Copy-Item target\e2e\debug\pc-agent.exe "$e2e\pc-agent-$($b.Version).exe"
          }
          "E2E=$e2e" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINISIGN=$minisign" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $global:LASTEXITCODE = 0

      # The service runs from C:\Program Files\pc-agent, as on a PC. Run 1:
      # pc-agent update installs 0.0.2, and the first ConnAck confirms it.
      # Run 2: 0.0.3 fails twice (a non-crash stop, so the flag must be on
      # for the restart), the third start rolls back to 0.0.2 and records
      # the failed build. Run 3: the HA update entity; an `install` command
      # does not install the failed 0.0.3 and installs 0.0.4 from the
      # service, with `[update] auto = false`.
      - name: Update the service with pc-agent update and roll back a broken build
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = 'C:\Program Files\pc-agent'
          $bin = "$dir\pc-agent.exe"
          $state = 'C:\ProgramData\pc-agent'
          $cfg = Join-Path $env:RUNNER_TEMP 'ci-config.toml'
          $topic = 'homeassistant/sensor/CI-TEST/lastboot/config'
          $commit2 = '2222222222222222222222222222222222222222'
          $commit3 = '3333333333333333333333333333333333333333'
          $commit4 = '4444444444444444444444444444444444444444'
          $updateConfig = 'homeassistant/update/CI-TEST/agent/config'
          $updateState = 'homeassistant/update/CI-TEST/agent/state'
          $updateCommand = 'homeassistant/update/CI-TEST/agent/set'
          $www = Join-Path $env:E2E 'www'
          $dl = "$www\latest\download"
          New-Item -ItemType Directory -Force -Path $dl, $dir | Out-Null
          $server = Start-Process -FilePath python -PassThru -NoNewWindow `
            -ArgumentList '-m', 'http.server', '18080', '--bind', '127.0.0.1', '--directory', $www `
            -RedirectStandardOutput "$env:E2E\http-out.log" -RedirectStandardError "$env:E2E\http-err.log"
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            try { (New-Object System.Net.Sockets.TcpClient('127.0.0.1', 18080)).Close(); $ready = $true }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw "the test HTTP server does not listen on 18080" }
          function Publish-Release($version, $commit, $file) {
            Copy-Item $file "$dl\pc-agent-x86_64-windows.exe" -Force
            $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $json = @"
          {
            "version": "$version",
            "commit": "$commit",
            "built_at": "2026-11-08T12:00:00Z",
            "platforms": {
              "x86_64-windows": { "asset": "pc-agent-x86_64-windows.exe", "sha256": "$sha" }
            }
          }
          "@
            [IO.File]::WriteAllText("$dl\manifest.json", $json)
            Remove-Item "$dl\manifest.json.minisig" -ErrorAction SilentlyContinue
            & $env:MINISIGN -S -s "$env:E2E\test.key" -m "$dl\manifest.json" -x "$dl\manifest.json.minisig" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "minisign -S failed" }
          }
          function Wait-Until($seconds, $what, [scriptblock]$condition) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($clock.Elapsed.TotalSeconds -lt $seconds) {
              if (& $condition) { return }
              Start-Sleep -Seconds 1
            }
            throw "$what within $seconds s"
          }
          function Get-SwVersion {
            $config = & $env:MQTT_READ $topic 3
            if ($config) { ($config | ConvertFrom-Json).device.sw_version }
          }
          function Wait-Version($expected, $seconds) {
            Wait-Until $seconds "no sw_version $expected" { (Get-SwVersion) -eq $expected }
            "sw_version: $expected"
          }
          function Same-File($a, $b) { (Get-FileHash $a).Hash -eq (Get-FileHash $b).Hash }
          # The retained state of the update entity must contain $expected.
          function Wait-State($expected, $seconds) {
            Wait-Until $seconds "no update state with $expected" {
              $global:lastState = & $env:MQTT_READ $updateState 3
              $global:lastState -and $global:lastState.Contains($expected)
            }
            "update state: $global:lastState"
          }
          # Run 3: the install command must install also with auto off, and
          # no scheduled install can run during the test.
          Add-Content -Path $cfg -Value "`n[update]`nauto = false"
          try {
            Copy-Item "$env:E2E\pc-agent-0.0.1.exe" $bin -Force
            & $bin install --config $cfg
            if ($LASTEXITCODE -ne 0) { throw "pc-agent install failed" }
            # The service reads the URL of the test server (a build of the test feature only).
            reg.exe add 'HKLM\SYSTEM\CurrentControlSet\Services\pc-agent' /v Environment /t REG_MULTI_SZ `
              /d 'PC_AGENT_UPDATE_URL=http://127.0.0.1:18080' /f | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "cannot set the environment of the service" }
            $flag = sc.exe qfailureflag pc-agent
            $flag
            if (-not ($flag -match 'TRUE')) { throw "install did not set the failure actions on non-crash failures" }
            # Each start sets the flag again (for a PC installed before the updater).
            sc.exe failureflag pc-agent 0 | Out-Null
            if (-not ((sc.exe qfailureflag pc-agent) -match 'FALSE')) { throw "cannot clear the flag" }
            sc.exe start pc-agent | Out-Null
            Wait-Version '0.0.1' 60
            $flag = sc.exe qfailureflag pc-agent
            if (-not ($flag -match 'TRUE')) { throw "the service start did not set the flag again: $flag" }

            $env:PC_AGENT_UPDATE_URL = 'http://127.0.0.1:18080'
            Publish-Release '0.0.2' $commit2 "$env:E2E\pc-agent-0.0.2.exe"
            & $bin update --channel stable --config $cfg
            if ($LASTEXITCODE -ne 0) { throw "pc-agent update failed" }
            if (-not (Same-File $bin "$env:E2E\pc-agent-0.0.2.exe")) { throw "the exe is not 0.0.2 after the install" }
            Wait-Version '0.0.2' 90
            Wait-Until 30 "update-pending.json or pc-agent.prev.exe is still there after the ConnAck" {
              -not (Test-Path "$state\update-pending.json") -and -not (Test-Path "$dir\pc-agent.prev.exe")
            }
            "OK: 0.0.2 runs and the update is confirmed"
            $again = & $bin update --channel stable --config $cfg
            $again
            if (-not ($again -contains 'up to date')) { throw "a second update did not print 'up to date'" }

            mosquitto_pub -h 127.0.0.1 -r -n -t $topic
            Publish-Release '0.0.3' $commit3 "$env:E2E\pc-agent-0.0.3.exe"
            & $bin update --channel stable --config $cfg
            if ($LASTEXITCODE -ne 0) { throw "pc-agent update to 0.0.3 failed" }
            Wait-Until 180 "no rollback of 0.0.3" {
              (Test-Path "$state\update-state.json") -and
                (Select-String -Path "$state\update-state.json" -SimpleMatch $commit3 -Quiet) -and
                -not (Test-Path "$state\update-pending.json")
            }
            Get-Content "$state\update-state.json"
            if (-not (Same-File $bin "$env:E2E\pc-agent-0.0.2.exe")) { throw "the exe is not 0.0.2 after the rollback" }
            # The retained config was cleared: only the old build can publish it again.
            Wait-Version '0.0.2' 90
            Select-String -Path "$state\pc-agent.log" -Pattern 'ConnAck|rolled back|update-test-exit|new build' |
              ForEach-Object { $_.Line }
            "OK: 0.0.3 failed, 0.0.2 is back and the failed build is recorded"
            $check = & $bin update --check --channel stable --config $cfg
            $check
            if (-not ($check -match "^newer build failed before: 0.0.3 commit $commit3")) { throw "update --check does not report the failed build" }

            # Run 3: the HA update entity and the install command.
            $config = & $env:MQTT_READ $updateConfig 5
            "update config: $config"
            $c = $config | ConvertFrom-Json
            if ($c.device_class -ne 'firmware' -or $c.command_topic -ne $updateCommand -or
                $c.payload_install -ne 'install' -or $c.unique_id -ne 'pc-agent-pc-agent-CI-TEST-update') {
              throw "the update discovery config is not as expected"
            }
            # Before a check: up to date (JSON keys in sorted order).
            Wait-State '"installed_version":"0.0.2","latest_version":"0.0.2"' 30
            # The failed 0.0.3 is still the release: the command checks, does not install it,
            # shows "up to date" and names the failed build in the summary.
            mosquitto_pub -h 127.0.0.1 -t $updateCommand -m install
            Wait-State '"release_summary":"Build 0.0.3 failed before' 60
            Start-Sleep -Seconds 5
            if (-not (Same-File $bin "$env:E2E\pc-agent-0.0.2.exe")) { throw "the install command installed the failed build" }
            Wait-State '"in_progress":false,"installed_version":"0.0.2","latest_version":"0.0.2"' 5
            "OK: the install command does not install a failed build"
            # A new release: the command installs it from the service (auto is off).
            Publish-Release '0.0.4' $commit4 "$env:E2E\pc-agent-0.0.4.exe"
            mosquitto_pub -h 127.0.0.1 -t $updateCommand -m install
            Wait-State '"installed_version":"0.0.4"' 120
            if (-not (Same-File $bin "$env:E2E\pc-agent-0.0.4.exe")) { throw "the exe is not 0.0.4 after the install command" }
            Wait-Version '0.0.4' 30
            Wait-Until 30 "update-pending.json or pc-agent.prev.exe is still there after the install command" {
              -not (Test-Path "$state\update-pending.json") -and -not (Test-Path "$dir\pc-agent.prev.exe")
            }
            $updateStateFile = Get-Content "$state\update-state.json" -Raw
            $updateStateFile
            if (-not $updateStateFile.Contains('"last_check"')) { throw "update-state.json has no last_check" }
            if ($updateStateFile.Contains('"last_auto_install"')) { throw "an install from HA was recorded as an automatic install" }
            "OK: the install command installed 0.0.4 from the service"
          } finally {
            & $bin uninstall
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            Get-ChildItem $dir -ErrorAction SilentlyContinue | ForEach-Object { "left in ${dir}: $($_.Name)" }
          }
          $global:LASTEXITCODE = 0

      - name: Show the logs
        if: always()
        run: |
          Get-Content C:\ProgramData\pc-agent\pc-agent.log -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:RUNNER_TEMP "mosquitto.log") -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

  # Licenses, advisories (RustSec), duplicate and wildcard crates, sources:
  # deny.toml.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features check

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # gitleaks lists the commits of a pull request.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          # Pin zizmor itself, so a new audit cannot fail CI without a change here.
          version: 1.31.1

  # Advisory: the coverage report goes to the job summary and an artifact, and a
  # failure of the report does not fail the job. A lower limit comes later.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure the coverage of the tests
        continue-on-error: true
        run: |
          cargo llvm-cov --lcov --output-path lcov.info
          {
            echo '### Coverage (advisory)'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  # The one required CI check of the freyr standard. It needs every other job of
  # this workflow; add each new job to `needs`.
  ci-gate:
    if: always()
    needs: [linux, macos, windows, deny, security, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/ci-gate@3f8fbbcf74283946ee3a7f63e21dd19bf02cdb77 # v1.0.0
        with:
          results: ${{ join(needs.*.result, ' ') }}
