[package]
name = "pc-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures-util = "0.3.34"
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "signal", "time", "sync", "process", "net", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
nvml-wrapper = "0.13.0"
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
io-kit-sys = "0.5.0"
libc = "0.2.191"

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "s"
codegen-units = 1
