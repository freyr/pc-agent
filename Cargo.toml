[package]
name = "pc-agent"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures-util = "0.3.34"
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "signal", "time", "sync", "process", "net", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
nvml-wrapper = "0.13.0"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", features = ["tokio"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
io-kit-sys = "0.5.0"
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "s"
codegen-units = 1
