[package]
name = "pc-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures-util = "0.3.34"
nvml-wrapper = "0.13.0"
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "signal", "time", "sync", "process", "net", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
